<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Pro DTF - Frente y Espalda</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      min-height: 100vh;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: #00b37e;
    }

    .app-layout {
      display: flex;
      gap: 32px;
      background: #202024;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Contenedor Mockup */
    .mockup-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .mockup-stage {
      position: relative;
      width: 500px;
      height: 560px;
      background: #18181b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    }

    /* Capa 1: Color de fondo con máscara */
    .shirt-color-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transition: background-color 0.15s ease;
      z-index: 1;
    }

    /* Capa 2: Canvas Fabric.js */
    .canvas-container-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    /* Capa 3: Textura y Arrugas (Multiply) */
    .shirt-overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 3;
    }

    /* Selector de Vistas Frontal / Trasera */
    .view-switcher {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .view-btn {
      flex: 1;
      padding: 10px;
      background: #29292e;
      border: 1px solid #3e3e42;
      color: #c4c4cc;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: #00875f;
      color: #ffffff;
      border-color: #00b37e;
    }

    /* Sidebar / Controles */
    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background: #29292e;
      padding: 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a8a8b3;
    }

    input[type="color"] {
      width: 100%;
      height: 44px;
      border: 1px solid #323238;
      border-radius: 6px;
      cursor: pointer;
      background: #121214;
    }

    .preset-colors {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .swatch {
      width: 100%;
      height: 32px;
      border-radius: 4px;
      border: 1px solid #3e3e42;
      cursor: pointer;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #00875f;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #00b37e;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #4d4d57;
      color: #c4c4cc;
    }

    .btn-outline:hover {
      background: #323238;
      color: #fff;
    }

    .btn-danger {
      background: #7a1f26;
    }

    .btn-danger:hover {
      background: #aa2834;
    }

    input[type="file"] {
      display: none;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Simulador DTF Multi-Vista</h1>
    <p>Diseña el frente y la espalda con texturas reales y límites de impresión</p>
  </header>

  <div class="app-layout">
    <!-- Contenedor del Mockup con selector de vistas -->
    <div class="mockup-wrapper">
      <div class="view-switcher">
        <button id="viewFrontBtn" class="view-btn active" onclick="switchView('front')">
          👕 Vista Frente
        </button>
        <button id="viewBackBtn" class="view-btn" onclick="switchView('back')">
          👕 Vista Espalda
        </button>
      </div>

      <div class="mockup-stage" id="stage">
        <!-- Capa 1: Color dinámico -->
        <div class="shirt-color-layer" id="shirtColorLayer"></div>
        
        <!-- Capa 2: Canvas interactivo -->
        <div class="canvas-container-layer">
          <canvas id="tshirtCanvas" width="500" height="560"></canvas>
        </div>

        <!-- Capa 3: Textura Multiply -->
        <div class="shirt-overlay-layer" id="shirtOverlayLayer"></div>
      </div>
    </div>

    <!-- Controles laterales -->
    <aside class="sidebar">
      <!-- Color -->
      <div class="panel-card">
        <label>Color de la prenda</label>
        <input type="color" id="shirtColor" value="#ffffff" />
        <div class="preset-colors">
          <button class="swatch" style="background: #ffffff;" onclick="updateColor('#ffffff')"></button>
          <button class="swatch" style="background: #111111;" onclick="updateColor('#111111')"></button>
          <button class="swatch" style="background: #8b0000;" onclick="updateColor('#8b0000')"></button>
          <button class="swatch" style="background: #0a2540;" onclick="updateColor('#0a2540')"></button>
          <button class="swatch" style="background: #2d5a27;" onclick="updateColor('#2d5a27')"></button>
          <button class="swatch" style="background: #d4af37;" onclick="updateColor('#d4af37')"></button>
        </div>
      </div>

      <!-- Estampados para la vista activa -->
      <div class="panel-card">
        <label id="activeViewLabel">Estampado (Frente)</label>
        <label for="imageUpload" class="btn">Subir Diseño a esta vista</label>
        <input type="file" id="imageUpload" accept="image/png, image/jpeg" />

        <div class="toggle-row">
          <span>Mostrar guía de impresión</span>
          <input type="checkbox" id="toggleGuide" checked />
        </div>

        <button class="btn btn-outline" id="centerHBtn">Centrar horizontalmente</button>
        <button class="btn btn-danger" id="deleteBtn">Eliminar estampado</button>
      </div>

      <!-- Descargas -->
      <div class="panel-card">
        <button class="btn" id="exportCurrentBtn" style="background: #12a454;">Descargar Vista Actual</button>
      </div>
    </aside>
  </div>

  <script>
    // 1. Configuración de Mockups por Vista
    // (Nota: Puedes reemplazar estas URLs por rutas locales como 'assets/front.png' y 'assets/back.png' en tu repo)
    const viewsConfig = {
      front: {
        maskUrl: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
        printArea: { left: 150, top: 130, width: 200, height: 280 }
      },
      back: {
        maskUrl: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png', // Textura de espalda
        printArea: { left: 140, top: 110, width: 220, height: 320 }
      }
    };

    let currentView = 'front';

    // Estado en memoria para almacenar los estampados de cada vista
    const shirtState = {
      front: [],
      back: []
    };

    // 2. Inicializar Fabric Canvas
    const canvas = new fabric.Canvas('tshirtCanvas', {
      preserveObjectStacking: true
    });

    let printGuide = null;
    let clipRect = null;

    // Crear/actualizar la guía y clipPath según la vista activa
    function setupPrintBoundary() {
      const area = viewsConfig[currentView].printArea;

      if (printGuide) canvas.remove(printGuide);

      clipRect = new fabric.Rect({
        left: area.left,
        top: area.top,
        width: area.width,
        height: area.height,
        absolutePositioned: true
      });

      const showGuide = document.getElementById('toggleGuide').checked;
      printGuide = new fabric.Rect({
        left: area.left,
        top: area.top,
        width: area.width,
        height: area.height,
        fill: 'rgba(0, 179, 126, 0.05)',
        stroke: '#00b37e',
        strokeDashArray: [6, 6],
        strokeWidth: 1.5,
        selectable: false,
        evented: false,
        visible: showGuide
      });

      canvas.add(printGuide);
      canvas.sendToBack(printGuide);
    }

    // 3. Manejo de cambio de Vistas (Frente / Espalda)
    function switchView(targetView) {
      if (currentView === targetView) return;

      // A. Guardar los objetos de diseño actuales (excluyendo la guía de impresión)
      const currentObjects = canvas.getObjects().filter(obj => obj !== printGuide);
      shirtState[currentView] = currentObjects.map(obj => obj.toObject(['clipPath']));

      // B. Cambiar la vista actual
      currentView = targetView;

      // Actualizar botones de interfaz
      document.getElementById('viewFrontBtn').classList.toggle('active', currentView === 'front');
      document.getElementById('viewBackBtn').classList.toggle('active', currentView === 'back');
      document.getElementById('activeViewLabel').innerText = `Estampado (${currentView === 'front' ? 'Frente' : 'Espalda'})`;

      // C. Cambiar imagen de máscara y overlay CSS
      const config = viewsConfig[currentView];
      const colorLayer = document.getElementById('shirtColorLayer');
      const overlayLayer = document.getElementById('shirtOverlayLayer');

      colorLayer.style.maskImage = `url('${config.maskUrl}')`;
      colorLayer.style.webkitMaskImage = `url('${config.maskUrl}')`;
      overlayLayer.style.backgroundImage = `url('${config.maskUrl}')`;

      // D. Limpiar canvas y regenerar la guía del nuevo lado
      canvas.clear();
      setupPrintBoundary();

      // E. Restaurar objetos del lado destino
      if (shirtState[currentView] && shirtState[currentView].length > 0) {
        fabric.util.enlivenObjects(shirtState[currentView], (enlivenedObjects) => {
          enlivenedObjects.forEach((obj) => {
            obj.set({ clipPath: clipRect });
            canvas.add(obj);
          });
          canvas.renderAll();
        });
      }
    }

    // 4. Inicialización inicial
    setupPrintBoundary();
    const initialConfig = viewsConfig.front;
    const colorLayer = document.getElementById('shirtColorLayer');
    const overlayLayer = document.getElementById('shirtOverlayLayer');
    colorLayer.style.maskImage = `url('${initialConfig.maskUrl}')`;
    colorLayer.style.webkitMaskImage = `url('${initialConfig.maskUrl}')`;
    overlayLayer.style.backgroundImage = `url('${initialConfig.maskUrl}')`;

    // 5. Manejo del Color
    const colorInput = document.getElementById('shirtColor');
    function updateColor(hex) {
      colorInput.value = hex;
      colorLayer.style.backgroundColor = hex;
    }
    colorInput.addEventListener('input', (e) => updateColor(e.target.value));

    // 6. Carga de Imágenes de Estampado
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        fabric.Image.fromURL(event.target.result, (img) => {
          const area = viewsConfig[currentView].printArea;

          if (img.width > area.width) {
            img.scaleToWidth(area.width * 0.85);
          }

          img.set({
            left: area.left + (area.width - img.getScaledWidth()) / 2,
            top: area.top + 30,
            cornerColor: '#00b37e',
            cornerStyle: 'circle',
            borderColor: '#00b37e',
            cornerSize: 10,
            transparentCorners: false,
            clipPath: clipRect
          });

          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
      e.target.value = ''; // Reset input
    });

    // 7. Acciones de Centrado y Eliminado
    document.getElementById('centerHBtn').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      const area = viewsConfig[currentView].printArea;
      if (active) {
        active.set({
          left: area.left + (area.width - active.getScaledWidth()) / 2
        });
        active.setCoords();
        canvas.renderAll();
      }
    });

    document.getElementById('toggleGuide').addEventListener('change', (e) => {
      if (printGuide) {
        printGuide.set('visible', e.target.checked);
        canvas.renderAll();
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (active && active !== printGuide) {
        canvas.remove(active);
        canvas.renderAll();
      }
    });

    // 8. Descarga de Mockup fusionado con multiply
    document.getElementById('exportCurrentBtn').addEventListener('click', () => {
      const guideWasVisible = printGuide.visible;
      printGuide.set('visible', false);
      canvas.renderAll();

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 500;
      exportCanvas.height = 560;
      const ctx = exportCanvas.getContext('2d');

      const overlayImg = new Image();
      overlayImg.crossOrigin = 'anonymous';
      overlayImg.src = viewsConfig[currentView].maskUrl;

      overlayImg.onload = () => {
        // Fondo con color de la tela
        ctx.fillStyle = colorInput.value;
        ctx.fillRect(0, 0, 500, 560);

        // Estampado
        ctx.drawImage(canvas.lowerCanvasEl, 0, 0);

        // Fusión Multiply con sombras reales
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(overlayImg, 0, 0, 500, 560);
        ctx.globalCompositeOperation = 'source-over';

        const link = document.createElement('a');
        link.download = `mockup-camiseta-${currentView}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();

        printGuide.set('visible', guideWasVisible);
        canvas.renderAll();
      };
    });
  </script>
</body>
</html>
