<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Camisetas Personalizadas</title>
  <!-- Fabric.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1e1e24;
      color: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    .container {
      display: flex;
      gap: 30px;
      background: #2b2c34;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      background: #3a3b45;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 280px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #a0a0b0;
    }

    input[type="color"] {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      padding: 10px 15px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #4338ca;
    }

    .btn-secondary {
      background: #374151;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .palette-btn {
      width: 100%;
      height: 32px;
      border-radius: 4px;
      border: 1px solid #555;
      cursor: pointer;
    }

    .hint {
      font-size: 0.8rem;
      color: #888;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Simulador de Camisas & Estampados</h1>
    <p>Personaliza el color y ubica tu diseño con facilidad</p>
  </header>

  <div class="container">
    <!-- Área del Mockup / Canvas -->
    <div class="canvas-wrapper">
      <canvas id="tshirtCanvas" width="450" height="500"></canvas>
    </div>

    <!-- Panel de Opciones -->
    <div class="controls">
      <div class="control-group">
        <label for="shirtColor">Color de la Camiseta:</label>
        <input type="color" id="shirtColor" value="#ffffff" />
        
        <!-- Colores rápidos predefinidos -->
        <div class="palette">
          <button class="palette-btn" style="background: #ffffff;" onclick="setShirtColor('#ffffff')"></button>
          <button class="palette-btn" style="background: #0a0a0a;" onclick="setShirtColor('#0a0a0a')"></button>
          <button class="palette-btn" style="background: #e63946;" onclick="setShirtColor('#e63946')"></button>
          <button class="palette-btn" style="background: #1d3557;" onclick="setShirtColor('#1d3557')"></button>
          <button class="palette-btn" style="background: #2a9d8f;" onclick="setShirtColor('#2a9d8f')"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Cargar Diseño / Estampado:</label>
        <label for="imageLoader" class="btn">Subir Imagen (PNG/JPG)</label>
        <input type="file" id="imageLoader" accept="image/*" />
        <p class="hint">Tip: Sube imágenes sin fondo (PNG) para un mejor acabado.</p>
      </div>

      <div class="control-group">
        <button class="btn btn-secondary" id="bringToFront">Traer al frente</button>
        <button class="btn btn-secondary" id="removeSelected">Eliminar diseño seleccionado</button>
        <button class="btn" id="exportBtn" style="background: #059669;">Descargar Vista Previa</button>
      </div>
    </div>
  </div>

  <script>
    // Inicializar Canvas de Fabric
    const canvas = new fabric.Canvas('tshirtCanvas');

    // Silueta vectorial de camiseta base (SVG path simplificado para probar sin imágenes externas)
    const shirtPath = "M 100 50 L 140 10 L 180 30 Q 225 60 270 30 L 310 10 L 350 50 L 320 100 L 290 85 L 290 380 L 160 380 L 160 85 L 130 100 Z";

    let shirtBackground;

    function initShirt() {
      shirtBackground = new fabric.Path(shirtPath, {
        fill: '#ffffff',
        stroke: '#444444',
        strokeWidth: 2,
        left: 50,
        top: 40,
        scaleX: 0.9,
        scaleY: 1.1,
        selectable: false,
        evented: false // No interactuable, solo fondo
      });

      canvas.add(shirtBackground);
      canvas.sendToBack(shirtBackground);
      canvas.renderAll();
    }

    initShirt();

    // Cambiar color de la camisa
    function setShirtColor(hex) {
      document.getElementById('shirtColor').value = hex;
      if (shirtBackground) {
        shirtBackground.set('fill', hex);
        canvas.renderAll();
      }
    }

    document.getElementById('shirtColor').addEventListener('input', (e) => {
      setShirtColor(e.target.value);
    });

    // Cargar imagen del estampado
    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (f) {
        fabric.Image.fromURL(f.target.result, (img) => {
          // Escalar la imagen para que quepa bien en el pecho de la camiseta
          img.scaleToWidth(140);
          img.set({
            left: 155,
            top: 150,
            cornerColor: '#4f46e5',
            cornerSize: 9,
            transparentCorners: false
          });

          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
    });

    // Eliminar objeto activo (estampado)
    document.getElementById('removeSelected').addEventListener('click', () => {
      const activeObject = canvas.getActiveObject();
      if (activeObject && activeObject !== shirtBackground) {
        canvas.remove(activeObject);
      }
    });

    // Descargar resultado
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataURL = canvas.toDataURL({
        format: 'png',
        quality: 1
      });
      const link = document.createElement('a');
      link.download = 'mi-diseno-camisa.png';
      link.href = dataURL;
      link.click();
    });
  </script>
</body>
</html>
