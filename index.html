<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Shirt Studio & Mockup Creator 3D</title>
  <!-- Fabric.js para el motor 2D interactivo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- Three.js para el motor 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls para interacción 3D -->
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&family=Oswald:wght@500;700&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-app: #121316;
      --bg-panel: #1b1c21;
      --bg-panel-light: #25262c;
      --border-color: #2e3038;
      --accent: #00b37e;
      --accent-hover: #02996c;
      --text-main: #f3f4f6;
      --text-muted: #8c8fa1;
      --danger: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 1. TOP NAVBAR */
    .topbar {
      height: 54px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand span {
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-panel-light);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #32333b;
    }

    /* 2. MAIN WORKSPACE */
    .main-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
      position: relative;
    }

    /* SIDEBAR IZQUIERDA (TOOL TABS) */
    .sidebar-left {
      width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: #16171a;
    }

    .nav-tab {
      flex: 1;
      padding: 12px 6px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-tab:hover {
      color: #fff;
    }

    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--bg-panel);
    }

    .tab-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .control-box {
      margin-bottom: 20px;
    }

    .color-picker-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .color-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .preset-ball {
      width: 100%;
      height: 34px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .preset-ball:hover {
      transform: scale(1.08);
    }

    .upload-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 24px 12px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      transition: all 0.2s;
    }

    .upload-dropzone:hover {
      border-color: var(--accent);
      background: rgba(0, 179, 126, 0.05);
    }

    .upload-dropzone p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    input[type="file"] {
      display: none;
    }

    .input-text {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-panel-light);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .select-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-panel-light);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    /* 3. CENTRO: VIEWPORT / CANVAS */
    .viewport {
      flex: 1;
      background: radial-gradient(circle, #252830 0%, #151619 100%);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: stretch;
      position: relative;
      gap: 0;
    }

    /* Split viewport sections */
    .viewport-2d {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border-right: 1px solid var(--border-color);
    }

    .viewport-3d {
      flex: 1;
      background: #0a0c0f;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-3d {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .control-3d button {
      padding: 6px 12px;
      background: var(--bg-panel-light);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .control-3d button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Selector flotante de Front / Back */
    .floating-views {
      position: absolute;
      top: 18px;
      display: flex;
      gap: 6px;
      background: var(--bg-panel);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .view-pill {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-pill.active {
      background: var(--accent);
      color: #fff;
    }

    /* Mockup Container */
    .mockup-container {
      position: relative;
      width: 480px;
      height: 540px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
    }

    /* Capa 1: Color con máscara */
    .layer-color {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      z-index: 1;
      transition: background-color 0.15s ease;
    }

    /* Capa 2: Fabric Canvas */
    .layer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    /* Capa 3: Sombras, textura y arrugas Multiply */
    .layer-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 3;
    }

    /* 4. SIDEBAR DERECHA (INSPECTOR DE ELEMENTO) */
    .sidebar-right {
      width: 260px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    .inspector-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .inspector-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .range-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .range-group span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      accent-color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- 1. TOPBAR ESTILO PRINTONATOR -->
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
      </svg>
      PRINT<span>STUDIO</span>
    </div>

    <div class="top-actions">
      <button class="btn btn-secondary" id="clearAllBtn">Limpiar Vista</button>
      <button class="btn btn-primary" id="downloadMockupBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Descargar Mockup (PNG)
      </button>
    </div>
  </header>

  <!-- 2. CONTENEDOR PRINCIPAL -->
  <main class="main-workspace">
    <!-- PANEL IZQUIERDO -->
    <aside class="sidebar-left">
      <div class="nav-tabs">
        <div class="nav-tab active" onclick="setTab('colorTab', this)">Color</div>
        <div class="nav-tab" onclick="setTab('imageTab', this)">Imágenes</div>
        <div class="nav-tab" onclick="setTab('textTab', this)">Texto</div>
      </div>

      <!-- TAB COLOR -->
      <div id="colorTab" class="tab-content active">
        <div class="section-title">Modelo de Camisa</div>
        <select id="shirtDesignSelect" class="select-input">
          <option value="classic">Clásica T-Shirt</option>
          <option value="oversized">Oversized</option>
          <option value="fitted">Fitted / Entallada</option>
          <option value="vneck">V-Neck</option>
          <option value="polo">Polo</option>
        </select>

        <div class="section-title">Color de la Camiseta</div>
        <div class="color-picker-wrapper">
          <input type="color" id="shirtColor" value="#ffffff" />
          <span id="colorHexText" style="font-size: 0.85rem; font-weight: 600;">#FFFFFF</span>
        </div>

        <div class="section-title">Colores Populares</div>
        <div class="color-presets">
          <div class="preset-ball" style="background: #ffffff;" onclick="applyColor('#ffffff')"></div>
          <div class="preset-ball" style="background: #111111;" onclick="applyColor('#111111')"></div>
          <div class="preset-ball" style="background: #1e3a8a;" onclick="applyColor('#1e3a8a')"></div>
          <div class="preset-ball" style="background: #b91c1c;" onclick="applyColor('#b91c1c')"></div>
          <div class="preset-ball" style="background: #15803d;" onclick="applyColor('#15803d')"></div>
          <div class="preset-ball" style="background: #f59e0b;" onclick="applyColor('#f59e0b')"></div>
          <div class="preset-ball" style="background: #6b7280;" onclick="applyColor('#6b7280')"></div>
          <div class="preset-ball" style="background: #4c1d95;" onclick="applyColor('#4c1d95')"></div>
          <div class="preset-ball" style="background: #ec4899;" onclick="applyColor('#ec4899')"></div>
          <div class="preset-ball" style="background: #d4af37;" onclick="applyColor('#d4af37')"></div>
        </div>
      </div>

      <!-- TAB IMAGEN -->
      <div id="imageTab" class="tab-content">
        <div class="section-title">Cargar Estampado</div>
        <label for="fileUpload" class="upload-dropzone">
          <svg width="32" height="32" fill="none" stroke="#8c8fa1" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <p><strong>Haz clic para subir</strong> o arrastra un archivo PNG / JPG</p>
        </label>
        <input type="file" id="fileUpload" accept="image/*" />
      </div>

      <!-- TAB TEXTO -->
      <div id="textTab" class="tab-content">
        <div class="section-title">Agregar Frase / Texto</div>
        <input type="text" id="customTextInput" class="input-text" placeholder="Escribe tu texto..." value="URBAN STYLE" />
        
        <label class="section-title" style="display:block; margin-top:8px;">Tipografía</label>
        <select id="fontSelect" class="select-input">
          <option value="Bebas Neue">Bebas Neue (Titular Urbano)</option>
          <option value="Oswald">Oswald (Impacto)</option>
          <option value="Montserrat" selected>Montserrat (Moderno)</option>
          <option value="Pacifico">Pacifico (Script / Cursiva)</option>
          <option value="Roboto">Roboto (Limpio)</option>
        </select>

        <label class="section-title" style="display:block;">Color de Fuente</label>
        <div class="color-picker-wrapper">
          <input type="color" id="textColor" value="#ffffff" />
        </div>

        <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="addTextBtn">
          + Agregar Texto al Diseño
        </button>
      </div>
    </aside>

    <!-- ÁREA CENTRAL (VIEWPORT) -->
    <section class="viewport">
      <!-- 2D VIEWPORT -->
      <div class="viewport-2d">
        <!-- Selector Frontal / Trasero flotante -->
        <div class="floating-views">
          <div id="btnFront" class="view-pill active" onclick="switchView('front')">FRENTE</div>
          <div id="btnBack" class="view-pill" onclick="switchView('back')">ESPALDA</div>
        </div>

        <!-- Mockup con triple capa realista -->
        <div class="mockup-container">
          <!-- Capa 1: Color de fondo recortado con máscara -->
          <div class="layer-color" id="shirtColorLayer"></div>
          
          <!-- Capa 2: Canvas interactivo -->
          <div class="layer-canvas">
            <canvas id="studioCanvas" width="480" height="540"></canvas>
          </div>

          <!-- Capa 3: Textura Multiply (sombras/arrugas) -->
          <div class="layer-texture" id="shirtTextureLayer"></div>
        </div>
      </div>

      <!-- 3D VIEWPORT -->
      <div class="viewport-3d">
        <canvas id="canvas3d"></canvas>
        <div class="control-3d">
          <span>Rotar: Arrastra | Zoom: Rueda</span>
          <button id="resetViewBtn" title="Resetear vista">↻ Reset</button>
          <button id="toggleView3dBtn" title="Cambiar vista">🔄 Frontal/Trasero</button>
        </div>
      </div>
    </section>

    <!-- PANEL DERECHO (INSPECTOR DE ELEMENTOS SELECCIONADOS) -->
    <aside class="sidebar-right">
      <div class="inspector-title">Propiedades</div>
      
      <div id="inspectorContent" style="display: flex; flex-direction: column; gap: 14px;">
        <p id="noSelectionMsg" style="font-size: 0.8rem; color: var(--text-muted);">
          Selecciona un elemento en la camisa para editarlo.
        </p>

        <div id="objectControls" style="display: none; flex-direction: column; gap: 14px;">
          <div class="range-group">
            <span>Opacidad</span>
            <input type="range" id="opacityRange" min="0.1" max="1" step="0.05" value="1" />
          </div>

          <div class="inspector-actions">
            <button class="btn btn-secondary" id="btnCenterH">Centrar Horizontal</button>
            <button class="btn btn-secondary" id="btnSendBack">Enviar atrás</button>
            <button class="btn btn-secondary" id="btnBringFront">Traer al frente</button>
            <button class="btn btn-secondary" id="btnDuplicate">Duplicar</button>
            <button class="btn btn-secondary" id="btnDelete" style="color: var(--danger); border-color: rgba(230,57,70,0.3);">
              Eliminar Elemento
            </button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    // 1. CONFIGURACIÓN COMPLETA DE DISEÑOS DE CAMISAS
    const shirtDesigns = {
      classic: {
        name: 'Clásica T-Shirt',
        front: {
          mask: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
          printArea: { left: 145, top: 125, width: 190, height: 275 }
        },
        back: {
          mask: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png',
          printArea: { left: 135, top: 105, width: 210, height: 320 }
        }
      },
      oversized: {
        name: 'Oversized',
        front: {
          mask: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
          printArea: { left: 120, top: 110, width: 240, height: 310 }
        },
        back: {
          mask: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png',
          printArea: { left: 110, top: 85, width: 260, height: 350 }
        }
      },
      fitted: {
        name: 'Fitted / Entallada',
        front: {
          mask: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
          printArea: { left: 160, top: 135, width: 160, height: 250 }
        },
        back: {
          mask: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png',
          printArea: { left: 155, top: 120, width: 170, height: 290 }
        }
      },
      vneck: {
        name: 'V-Neck',
        front: {
          mask: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
          printArea: { left: 145, top: 145, width: 190, height: 255 }
        },
        back: {
          mask: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png',
          printArea: { left: 135, top: 105, width: 210, height: 320 }
        }
      },
      polo: {
        name: 'Polo',
        front: {
          mask: 'https://i.ibb.co/3sX8M8K/tshirt-mask.png',
          printArea: { left: 145, top: 160, width: 190, height: 240 }
        },
        back: {
          mask: 'https://i.ibb.co/6P0qM3P/tshirt-back-mask.png',
          printArea: { left: 135, top: 125, width: 210, height: 300 }
        }
      }
    };

    let currentDesign = 'classic';
    let viewSettings = shirtDesigns[currentDesign];

    // Almacenamiento de estados por diseño y vista
    const designStates = {};
    Object.keys(shirtDesigns).forEach(designKey => {
      designStates[designKey] = { front: [], back: [] };
    });

    // Función para cambiar diseño de camisa
    function switchShirtDesign(designKey) {
      if (currentDesign === designKey) return;

      // Guardar diseño del lado actual en el almacenamiento del diseño actual
      const elements = canvas.getObjects().filter(o => o !== printBoundaryGuide);
      designStates[currentDesign][activeSide] = elements.map(o => o.toObject(['clipPath']));

      currentDesign = designKey;
      viewSettings = shirtDesigns[currentDesign];

      // Actualizar máscara y área de impresión
      const conf = viewSettings[activeSide];
      const cLayer = document.getElementById('shirtColorLayer');
      const tLayer = document.getElementById('shirtTextureLayer');

      cLayer.style.maskImage = `url('${conf.mask}')`;
      cLayer.style.webkitMaskImage = `url('${conf.mask}')`;
      tLayer.style.backgroundImage = `url('${conf.mask}')`;

      // Limpiar y reinicializar
      canvas.clear();
      initPrintArea();

      // Restaurar el estado del nuevo diseño
      if (designStates[currentDesign][activeSide] && designStates[currentDesign][activeSide].length > 0) {
        fabric.util.enlivenObjects(designStates[currentDesign][activeSide], (restored) => {
          restored.forEach(obj => {
            obj.set({ clipPath: currentClipRect });
            canvas.add(obj);
          });
          canvas.renderAll();
        });
      }
    }

    let activeSide = 'front';

    // 2. INICIALIZAR FABRIC.JS
    const canvas = new fabric.Canvas('studioCanvas', {
      preserveObjectStacking: true
    });

    let printBoundaryGuide = null;
    let currentClipRect = null;

    function initPrintArea() {
      const area = viewSettings[activeSide].printArea;
      
      if (printBoundaryGuide) canvas.remove(printBoundaryGuide);

      // Rectángulo que limita el área de recorte
      currentClipRect = new fabric.Rect({
        left: area.left,
        top: area.top,
        width: area.width,
        height: area.height,
        absolutePositioned: true
      });

      // Guía visual punteada
      printBoundaryGuide = new fabric.Rect({
        left: area.left,
        top: area.top,
        width: area.width,
        height: area.height,
        fill: 'transparent',
        stroke: 'rgba(0, 179, 126, 0.45)',
        strokeDashArray: [5, 5],
        strokeWidth: 1.5,
        selectable: false,
        evented: false
      });

      canvas.add(printBoundaryGuide);
      canvas.sendToBack(printBoundaryGuide);
    }

    // 3. CAMBIAR VISTA (FRONT / BACK)
    function switchView(target) {
      if (activeSide === target) return;

      // Guardar diseño del lado visible
      const elements = canvas.getObjects().filter(o => o !== printBoundaryGuide);
      designStates[currentDesign][activeSide] = elements.map(o => o.toObject(['clipPath']));

      activeSide = target;

      // Actualizar píldoras visuales
      document.getElementById('btnFront').classList.toggle('active', activeSide === 'front');
      document.getElementById('btnBack').classList.toggle('active', activeSide === 'back');

      // Actualizar máscara y sombras
      const conf = viewSettings[activeSide];
      const cLayer = document.getElementById('shirtColorLayer');
      const tLayer = document.getElementById('shirtTextureLayer');

      cLayer.style.maskImage = `url('${conf.mask}')`;
      cLayer.style.webkitMaskImage = `url('${conf.mask}')`;
      tLayer.style.backgroundImage = `url('${conf.mask}')`;

      // Limpiar y restaurar
      canvas.clear();
      initPrintArea();

      if (designStates[currentDesign][activeSide] && designStates[currentDesign][activeSide].length > 0) {
        fabric.util.enlivenObjects(designStates[currentDesign][activeSide], (restored) => {
          restored.forEach(obj => {
            obj.set({ clipPath: currentClipRect });
            canvas.add(obj);
          });
          canvas.renderAll();
        });
      }
    }

    // Inicializar visualización base
    initPrintArea();
    const initialConf = viewSettings.front;
    document.getElementById('shirtColorLayer').style.maskImage = `url('${initialConf.mask}')`;
    document.getElementById('shirtColorLayer').style.webkitMaskImage = `url('${initialConf.mask}')`;
    document.getElementById('shirtTextureLayer').style.backgroundImage = `url('${initialConf.mask}')`;

    // 4. CAMBIO DE COLOR DE LA TELA
    const shirtColorPicker = document.getElementById('shirtColor');
    const colorHexText = document.getElementById('colorHexText');
    const shirtColorLayer = document.getElementById('shirtColorLayer');

    function applyColor(hex) {
      shirtColorPicker.value = hex;
      colorHexText.innerText = hex.toUpperCase();
      shirtColorLayer.style.backgroundColor = hex;
    }

    shirtColorPicker.addEventListener('input', (e) => applyColor(e.target.value));

    // 4.5. CAMBIO DE DISEÑO DE CAMISA
    const shirtDesignSelect = document.getElementById('shirtDesignSelect');
    shirtDesignSelect.addEventListener('change', (e) => {
      switchShirtDesign(e.target.value);
    });

    // 5. PESTAÑAS LATERALES
    function setTab(tabId, el) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // 6. CARGAR IMÁGENES
    document.getElementById('fileUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (f) => {
        fabric.Image.fromURL(f.target.result, (img) => {
          const area = viewSettings[activeSide].printArea;
          if (img.width > area.width) {
            img.scaleToWidth(area.width * 0.85);
          }

          img.set({
            left: area.left + (area.width - img.getScaledWidth()) / 2,
            top: area.top + 30,
            cornerColor: '#00b37e',
            borderColor: '#00b37e',
            cornerSize: 9,
            cornerStyle: 'circle',
            transparentCorners: false,
            clipPath: currentClipRect
          });

          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    // 7. AGREGAR TEXTO CON FUENTES
    document.getElementById('addTextBtn').addEventListener('click', () => {
      const textVal = document.getElementById('customTextInput').value.trim();
      if (!textVal) return;

      const fontVal = document.getElementById('fontSelect').value;
      const colorVal = document.getElementById('textColor').value;
      const area = viewSettings[activeSide].printArea;

      const textObj = new fabric.Text(textVal, {
        left: area.left + 20,
        top: area.top + 50,
        fontFamily: fontVal,
        fill: colorVal,
        fontSize: 32,
        cornerColor: '#00b37e',
        borderColor: '#00b37e',
        cornerSize: 9,
        cornerStyle: 'circle',
        transparentCorners: false,
        clipPath: currentClipRect
      });

      canvas.add(textObj);
      canvas.setActiveObject(textObj);
      canvas.renderAll();
    });

    // 8. INSPECTOR DERECHO Y EVENTOS
    const noSelectionMsg = document.getElementById('noSelectionMsg');
    const objectControls = document.getElementById('objectControls');
    const opacityRange = document.getElementById('opacityRange');

    function updateInspector() {
      const active = canvas.getActiveObject();
      if (active && active !== printBoundaryGuide) {
        noSelectionMsg.style.display = 'none';
        objectControls.style.display = 'flex';
        opacityRange.value = active.opacity || 1;
      } else {
        noSelectionMsg.style.display = 'block';
        objectControls.style.display = 'none';
      }
    }

    canvas.on('selection:created', updateInspector);
    canvas.on('selection:updated', updateInspector);
    canvas.on('selection:cleared', updateInspector);

    opacityRange.addEventListener('input', (e) => {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('opacity', parseFloat(e.target.value));
        canvas.renderAll();
      }
    });

    document.getElementById('btnCenterH').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      const area = viewSettings[activeSide].printArea;
      if (active) {
        active.set('left', area.left + (area.width - active.getScaledWidth()) / 2);
        active.setCoords();
        canvas.renderAll();
      }
    });

    document.getElementById('btnBringFront').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (active) {
        active.bringToFront();
        canvas.renderAll();
      }
    });

    document.getElementById('btnSendBack').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (active) {
        active.sendToBack();
        canvas.sendToBack(printBoundaryGuide); // Mantener guía al fondo
        canvas.renderAll();
      }
    });

    document.getElementById('btnDuplicate').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (active) {
        active.clone((cloned) => {
          cloned.set({
            left: active.left + 15,
            top: active.top + 15,
            clipPath: currentClipRect
          });
          canvas.add(cloned);
          canvas.setActiveObject(cloned);
          canvas.renderAll();
        });
      }
    });

    document.getElementById('btnDelete').addEventListener('click', () => {
      const active = canvas.getActiveObject();
      if (active) {
        canvas.remove(active);
        canvas.renderAll();
        updateInspector();
      }
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      const toRemove = canvas.getObjects().filter(o => o !== printBoundaryGuide);
      toRemove.forEach(o => canvas.remove(o));
      canvas.renderAll();
      updateInspector();
    });

    // 9. DESCARGA EN ALTA RESOLUCIÓN CON MULTIPLY (FUSIÓN COMPLETA)
    document.getElementById('downloadMockupBtn').addEventListener('click', () => {
      const guideVisible = printBoundaryGuide.visible;
      printBoundaryGuide.set('visible', false);
      canvas.renderAll();

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 480;
      exportCanvas.height = 540;
      const ctx = exportCanvas.getContext('2d');

      const overlayImg = new Image();
      overlayImg.crossOrigin = 'anonymous';
      overlayImg.src = viewSettings[activeSide].mask;

      overlayImg.onload = () => {
        // 1. Color de prenda
        ctx.fillStyle = shirtColorPicker.value;
        ctx.fillRect(0, 0, 480, 540);

        // 2. Estampados
        ctx.drawImage(canvas.lowerCanvasEl, 0, 0);

        // 3. Sombras de tela en Multiply
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(overlayImg, 0, 0, 480, 540);
        ctx.globalCompositeOperation = 'source-over';

        // Descarga
        const link = document.createElement('a');
        link.download = `mockup-${activeSide}-${Date.now()}.png`;
        link.href = exportCanvas.toDataURL('image/png');
        link.click();

        printBoundaryGuide.set('visible', guideVisible);
        canvas.renderAll();
      };
    });

    // ============================================
    // 3D SHIRT RENDERER WITH THREE.JS
    // ============================================
    let scene, camera, renderer, shirt, controls, canvas3d;
    let is3dInitialized = false;

    function init3D() {
      if (is3dInitialized) return;
       
      canvas3d = document.getElementById('canvas3d');
      if (!canvas3d) return; // Canvas not yet in DOM
       
      const width = canvas3d.parentElement.clientWidth;
      const height = canvas3d.parentElement.clientHeight;
       
      // Skip if dimensions are not ready
      if (width < 100 || height < 100) {
        setTimeout(init3D, 100);
        return;
      }
       
      is3dInitialized = true;
       
      // Set canvas width and height attributes explicitly
      canvas3d.width = width;
      canvas3d.height = height;

      // Scene setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0c0f);
      scene.fog = new THREE.Fog(0x0a0c0f, 100, 1000);

      // Camera
      camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
      camera.position.set(0, 0, 2.5);

      // Renderer
      renderer = new THREE.WebGLRenderer({ 
        canvas: canvas3d, 
        antialias: true, 
        alpha: false 
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowShadowMap;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      directionalLight.castShadow = true;
      directionalLight.shadow.mapSize.width = 2048;
      directionalLight.shadow.mapSize.height = 2048;
      directionalLight.shadow.camera.far = 50;
      scene.add(directionalLight);

      // Grid floor
      const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x1a1a1a);
      gridHelper.position.y = -1.2;
      scene.add(gridHelper);

      // Create shirt
      createShirt();

      // Controls
      controls = new THREE.OrbitControls(camera, canvas3d);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 2;
      controls.minDistance = 1.5;
      controls.maxDistance = 5;

      // Button controls
      document.getElementById('resetViewBtn').addEventListener('click', resetView3D);
      document.getElementById('toggleView3dBtn').addEventListener('click', toggle3dView);

      // Handle resize
      window.addEventListener('resize', onWindowResize);

      // Start animation
      animate3D();
    }

    function createShirt() {
      // Shirt geometry
      const shirtGeometry = new THREE.IcosahedronGeometry(1.2, 6);
      
      // Create material with canvas texture
      const canvas2d = document.getElementById('studioCanvas');
      const texture = new THREE.CanvasTexture(canvas2d);
      texture.flipY = false;

      const shirtMaterial = new THREE.MeshPhongMaterial({
        map: texture,
        emissive: 0x000000,
        shininess: 20,
        flatShading: false
      });

      shirt = new THREE.Mesh(shirtGeometry, shirtMaterial);
      shirt.castShadow = true;
      shirt.receiveShadow = true;
      shirt.scale.set(1, 1.3, 0.8);
      scene.add(shirt);

      // Update texture when canvas changes
      if (canvas) {
        canvas.on('object:modified', updateShirtTexture);
        canvas.on('object:added', updateShirtTexture);
        canvas.on('object:removed', updateShirtTexture);
      }
    }

    function updateShirtTexture() {
      if (!shirt || !scene) return;
      
      try {
        const canvas2d = document.getElementById('studioCanvas');
        if (!canvas2d) return;
        
        const texture = new THREE.CanvasTexture(canvas2d);
        texture.flipY = false;
        texture.needsUpdate = true;
        
        shirt.material.map = texture;
        shirt.material.needsUpdate = true;
      } catch (e) {
        console.warn('Texture update failed:', e);
      }
    }

    function resetView3D() {
      if (camera && controls) {
        camera.position.set(0, 0, 2.5);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    }

    function toggle3dView() {
      if (camera) {
        const currentZ = camera.position.z;
        const currentX = camera.position.x;
        
        // Toggle front/back view
        if (currentX > 0.5) {
          camera.position.x = -2.5;
        } else {
          camera.position.x = 2.5;
        }
        controls.update();
      }
    }

    function onWindowResize() {
      if (!renderer) return;
      const container = canvas3d.parentElement;
      const width = container.clientWidth;
      const height = container.clientHeight;
      canvas3d.width = width;
      canvas3d.height = height;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animate3D() {
      try {
        requestAnimationFrame(animate3D);
        
        if (controls) controls.update();
        if (shirt) {
          // Gentle floating motion
          shirt.rotation.y += 0.001;
        }
        
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      } catch (e) {
        console.warn('Animation error:', e);
      }
    }

    // Initialize 3D when page loads
    window.addEventListener('load', () => {
      try {
        setTimeout(init3D, 100);
      } catch (e) {
        console.warn('3D initialization deferred:', e);
      }
    });

    // Also try to initialize immediately if DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        try {
          setTimeout(init3D, 100);
        } catch (e) {
          console.warn('3D initialization failed:', e);
        }
      });
    } else {
      try {
        setTimeout(init3D, 100);
      } catch (e) {
        console.warn('3D initialization failed:', e);
      }
    }

    // Update shirt color in 3D
    try {
      shirtColor.addEventListener('change', (e) => {
        if (shirt) {
          const color = new THREE.Color(e.target.value);
          shirt.material.color = color;
        }
      });
    } catch (e) {
      console.warn('Shirt color listener failed:', e);
    }

  </script>
</body>
</html>
